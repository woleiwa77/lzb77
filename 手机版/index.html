<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f4f6fb">
<meta name="description" content="鲁周柏 · 东北大学计算机科学与技术 · 人工智能训练师 · 个人简历">
<title>鲁周柏 · 个人简历</title>
<script>
(function(){var d=document.documentElement;d.className+=' js';var t;try{t=localStorage.getItem('theme')}catch(e){}
if(!t){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}
d.setAttribute('data-theme',t);})();
</script>
<style>
:root{
  --pri:#3b5bfd;--pri2:#7c5cff;--teal:#0d9488;
  --bg:#f4f6fb;--surface:#fff;--surface2:#eef1f8;
  --text:#0f1729;--text2:#49536a;--muted:#7c88a1;--line:#e4e8f2;
  --navbg:rgba(244,246,251,.86);
  --r:14px;--r2:18px;
  --sh:0 1px 2px rgba(15,23,41,.05);
  --sh2:0 16px 32px -22px rgba(15,23,41,.55);
  --nav-h:56px;--maxw:1040px;--pad:16px;
}
html[data-theme="dark"]{
  --pri:#8fa5ff;--pri2:#b79cff;--teal:#2dd4bf;
  --bg:#0a0d16;--surface:#121826;--surface2:#1a2133;
  --text:#e9edf7;--text2:#aeb8cb;--muted:#828da6;--line:#242c42;
  --navbg:rgba(10,13,22,.84);
  --sh:0 1px 2px rgba(0,0,0,.32);
  --sh2:0 18px 36px -22px rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:border-box}
html{
  -webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:64px;
  -webkit-tap-highlight-color:transparent;
}
body{
  margin:0;font-size:15px;line-height:1.7;color:var(--text);background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",
    "Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));
  overflow-x:hidden;
  transition:background-color .2s ease,color .2s ease;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(560px 320px at 6% -6%,rgba(59,91,253,.12),transparent 62%),
    radial-gradient(500px 300px at 98% 2%,rgba(124,92,255,.11),transparent 64%);
}
html[data-theme="dark"] body::before{
  background:
    radial-gradient(560px 320px at 6% -6%,rgba(90,120,255,.18),transparent 62%),
    radial-gradient(500px 300px at 98% 2%,rgba(140,110,255,.16),transparent 64%);
}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
button{font:inherit;color:inherit}
svg{display:block;flex:0 0 auto}
::selection{background:rgba(59,91,253,.22)}
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 var(--pad)}

/* ===== 顶部导航 ===== */
.nav{
  position:sticky;top:0;z-index:50;background:var(--navbg);
  -webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
}
.nav-in{
  max-width:var(--maxw);margin:0 auto;height:var(--nav-h);
  display:flex;align-items:center;gap:4px;padding:0 10px;
}
.brand{
  flex:0 0 auto;font-size:15px;font-weight:800;letter-spacing:-.01em;
  text-decoration:none;padding:0 6px;height:44px;display:flex;align-items:center;
}
.brand span{background:linear-gradient(135deg,var(--pri),var(--pri2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.nav-links{
  flex:1 1 auto;min-width:0;display:flex;gap:2px;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;
}
.nav-links::-webkit-scrollbar{display:none}
.nav-link{
  flex:0 0 auto;display:flex;align-items:center;height:44px;padding:0 12px;
  border-radius:11px;font-size:13.5px;font-weight:600;color:var(--text2);
  text-decoration:none;white-space:nowrap;scroll-snap-align:center;
  transition:color .18s ease,background-color .18s ease;
}
.nav-link.active{color:var(--pri);background:var(--surface2)}
.nav-act{flex:0 0 auto;display:flex;align-items:center;gap:2px}
.icon-btn{
  width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:12px;
  background:transparent;color:var(--text2);cursor:pointer;
  transition:background-color .18s ease,color .18s ease,transform .18s ease;
}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.icon-btn:active{transform:scale(.92)}
.nav .btn-ghost{display:none}

/* ===== 通用组件 ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);font-size:14px;font-weight:600;
  text-decoration:none;cursor:pointer;white-space:nowrap;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background-color .18s ease;
}
.btn:active{transform:scale(.975)}
.btn-primary{
  background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-color:transparent;
  box-shadow:0 10px 22px -14px var(--pri);
}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);transition:transform .18s ease,box-shadow .18s ease;
}
@media (hover:hover){.card:hover{transform:translateY(-2px);box-shadow:var(--sh2)}}

.sec{padding:34px 0}
.sec-title{position:relative;padding-left:13px;font-size:18.5px;font-weight:800;letter-spacing:-.015em;margin-bottom:18px}
.sec-title::before{
  content:"";position:absolute;left:0;top:.2em;bottom:.2em;width:4px;border-radius:3px;
  background:linear-gradient(180deg,var(--pri),var(--pri2));
}
.sub-head{
  display:flex;align-items:center;gap:8px;margin:20px 0 12px;
  font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);
}
.sub-head::after{content:"";flex:1;height:1px;background:var(--line)}
.sub-head:first-child{margin-top:0}

/* ===== Hero ===== */
.hero{padding:20px 0 6px}
.hero-card{
  position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r2);padding:20px 18px;box-shadow:var(--sh);
}
.hero-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--pri),var(--pri2),var(--teal));
}
.hero-head{display:flex;align-items:center;gap:14px}
.avatar{
  width:62px;height:62px;flex:0 0 auto;border-radius:18px;display:grid;place-items:center;
  font-size:25px;font-weight:800;color:#fff;user-select:none;
  background:linear-gradient(140deg,var(--pri),var(--pri2));
  box-shadow:0 12px 24px -16px var(--pri);
}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.hero-name{font-size:26px;font-weight:800;letter-spacing:-.022em;line-height:1.2}
.hero-role{margin-top:4px;font-size:13px;color:var(--text2);font-weight:500;line-height:1.55}
.hero-sum{margin-top:16px;font-size:14px;color:var(--text2);line-height:1.85}
.contact-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.chip-link{
  display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;
  font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);
  border:1px solid var(--line);border-radius:999px;text-decoration:none;cursor:pointer;
  transition:color .18s ease,border-color .18s ease,background-color .18s ease;
}
.chip-link:active{color:var(--pri);border-color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.hero-card .chips{margin-top:16px}
.chip{
  font-size:12px;line-height:1.5;padding:5px 10px;border-radius:8px;
  background:var(--surface2);color:var(--text2);border:1px solid var(--line);
}
.chip-kw{color:var(--pri);background:transparent;border-color:rgba(59,91,253,.28);font-weight:600}
html[data-theme="dark"] .chip-kw{border-color:rgba(143,165,255,.32)}
.hero-cta{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;padding-top:18px;border-top:1px dashed var(--line)}
.hero-cta .btn{flex:1 1 42%}

/* ===== 亮点 ===== */
.hl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.hl-card{position:relative;overflow:hidden;padding:16px 14px}
.hl-card::after{
  content:"";position:absolute;right:-24px;top:-24px;width:74px;height:74px;border-radius:50%;
  background:linear-gradient(135deg,var(--pri),var(--pri2));opacity:.08;
}
.hl-value{
  font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.25;
  background:linear-gradient(135deg,var(--pri),var(--pri2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
}
.hl-label{margin-top:6px;font-size:13.5px;font-weight:700}
.hl-desc{margin-top:3px;font-size:12px;color:var(--muted);line-height:1.5}

/* ===== Tabs ===== */
.tablist{
  display:flex;gap:4px;padding:4px;margin-bottom:16px;border-radius:13px;
  background:var(--surface2);border:1px solid var(--line);width:100%;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.tablist::-webkit-scrollbar{display:none}
.tab{
  flex:1 0 auto;min-height:44px;padding:0 16px;border:0;border-radius:10px;background:transparent;
  color:var(--text2);font-size:13.5px;font-weight:700;white-space:nowrap;cursor:pointer;
  transition:background-color .18s ease,color .18s ease,box-shadow .18s ease;
}
.tab.active{background:var(--surface);color:var(--pri);box-shadow:var(--sh)}
.tab:focus-visible,.nav-link:focus-visible,.btn:focus-visible,.icon-btn:focus-visible,
.chip-link:focus-visible,.award-img:focus-visible{
  outline:2px solid var(--pri);outline-offset:2px;
}
.tabpanel{outline:none}
.tabpanel[hidden]{display:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tabpanel{animation:fadeUp .24s cubic-bezier(.22,.61,.36,1)}

/* ===== 项目 ===== */
.proj-grid{display:grid;grid-template-columns:1fr;gap:12px}
.proj-card{display:flex;flex-direction:column;gap:11px;padding:18px}
.proj-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.proj-name{font-size:15.5px;font-weight:800;letter-spacing:-.01em;line-height:1.4}
.proj-role{margin-top:3px;font-size:12.5px;font-weight:700;color:var(--pri)}
.proj-meta{
  font-size:11.5px;color:var(--muted);background:var(--surface2);
  border:1px solid var(--line);padding:3px 9px;border-radius:999px;white-space:nowrap;
}
.proj-stack{display:flex;flex-wrap:wrap;gap:5px}
.stack-chip{font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.proj-points{display:flex;flex-direction:column;gap:7px;font-size:13.5px;color:var(--text2);line-height:1.75}
.proj-points li{position:relative;padding-left:15px}
.proj-points li::before{
  content:"";position:absolute;left:0;top:.68em;width:5px;height:5px;border-radius:50%;
  background:linear-gradient(135deg,var(--pri),var(--pri2));
}
.proj-link{
  display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:13px;
  font-weight:700;color:var(--pri);text-decoration:none;align-self:flex-start;
}
.proj-link:active{opacity:.7}

/* ===== 技能 ===== */
.skill-grid{display:grid;grid-template-columns:1fr;gap:12px}
.skill-card{padding:16px}
.skill-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin-bottom:11px}
.skill-title .dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));flex:0 0 auto}

/* ===== 教育 ===== */
.edu-card{padding:18px}
.edu-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.edu-school{font-size:17px;font-weight:800;letter-spacing:-.015em}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--pri);white-space:nowrap}
.edu-meta{margin-top:9px;font-size:13px;color:var(--text2);line-height:1.7}

/* ===== 获奖与证书 ===== */
.award-block + .award-block{margin-top:6px}
.award-list{display:grid;grid-template-columns:1fr;gap:10px}
.award-item{display:flex;gap:12px;align-items:flex-start;padding:15px}
.award-icon{
  width:36px;height:36px;flex:0 0 auto;display:grid;place-items:center;border-radius:11px;
  background:var(--surface2);color:var(--pri);
}
.award-body{min-width:0;flex:1}
.award-name{font-size:14px;font-weight:800;line-height:1.5}
.award-issuer{margin-top:2px;font-size:12.5px;font-weight:700;color:var(--pri)}
.award-note{margin-top:3px;font-size:12.5px;color:var(--muted)}
.award-desc{margin-top:7px;font-size:13px;color:var(--text2);line-height:1.78}

/* 证书图片：懒加载 + 淡入 + 可点击放大 */
.award-figure{
  position:relative;
  margin-top:12px;
  max-width:340px;
  border-radius:10px;
  overflow:hidden;
  background:var(--surface2);
}
.award-img{
  display:block;width:100%;height:auto;
  border-radius:10px;border:1px solid var(--line);
  cursor:zoom-in;
  opacity:0;
  transition:opacity .35s ease,transform .2s ease;
}
.award-img.loaded{opacity:1}
.award-img:active{transform:scale(.995)}
.award-figure .zoom-tip{
  position:absolute;right:8px;bottom:8px;
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 8px;border-radius:999px;
  font-size:11px;font-weight:700;color:#fff;
  background:rgba(15,23,41,.62);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  pointer-events:none;
}
.award-img.img-error{
  min-height:130px;
  border-style:dashed;
  background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 8px,var(--surface) 8px,var(--surface) 16px);
}
.img-tip{
  margin-top:8px;font-size:12px;color:var(--muted);
  line-height:1.6;word-break:break-all;
}

/* ===== 自评 ===== */
.about-card{padding:18px}
.about-text{font-size:14px;color:var(--text2);line-height:1.95;text-align:justify}

/* ===== 页脚 ===== */
.footer{
  padding:26px 0 30px;text-align:center;font-size:12.5px;color:var(--muted);
  border-top:1px solid var(--line);margin-top:16px;line-height:1.8;
}

/* ===== 底部快捷操作栏 ===== */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:8px;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));
  background:var(--navbg);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);
}
.dock .btn{flex:1 1 0;min-width:0;padding:0 10px;font-size:13.5px}
.dock .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== 返回顶部 ===== */
.to-top{
  position:fixed;right:14px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:70;
  width:46px;height:46px;display:grid;place-items:center;border-radius:14px;
  border:1px solid var(--line);background:var(--surface);color:var(--text2);
  box-shadow:var(--sh2);cursor:pointer;opacity:0;pointer-events:none;
  transition:opacity .2s ease,transform .2s ease,color .2s ease;
}
.to-top.show{opacity:1;pointer-events:auto}
.to-top:active{transform:scale(.94)}

/* ===== Toast ===== */
.toast{
  position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:200;
  max-width:calc(100vw - 32px);padding:11px 16px;border-radius:11px;
  background:var(--text);color:var(--bg);font-size:13.5px;font-weight:600;line-height:1.5;
  text-align:center;box-shadow:var(--sh2);opacity:0;pointer-events:none;
  transform:translate(-50%,14px);transition:opacity .22s ease,transform .22s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== 灯箱：查看证书大图 ===== */
.lightbox{
  position:fixed;inset:0;z-index:500;
  display:grid;place-items:center;
  padding:20px;
  background:rgba(8,11,20,.92);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  opacity:0;
  transition:opacity .2s ease;
}
.lightbox[hidden]{display:none}
.lightbox.show{opacity:1}
.lightbox-img{
  max-width:100%;
  max-height:86vh;
  max-height:86dvh;
  border-radius:12px;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.75);
  transform:scale(.97);
  transition:transform .22s cubic-bezier(.22,.61,.36,1);
  background:#fff;
}
.lightbox.show .lightbox-img{transform:scale(1)}
.lightbox-close{
  position:absolute;
  top:calc(14px + env(safe-area-inset-top,0px));
  right:14px;
  width:44px;height:44px;
  display:grid;place-items:center;
  border:0;border-radius:50%;
  background:rgba(255,255,255,.14);
  color:#fff;font-size:24px;line-height:1;font-weight:400;
  cursor:pointer;
  transition:background-color .18s ease,transform .18s ease;
}
.lightbox-close:hover{background:rgba(255,255,255,.24)}
.lightbox-close:active{transform:scale(.92)}
.lightbox-hint{
  position:absolute;
  bottom:calc(16px + env(safe-area-inset-bottom,0px));
  left:50%;transform:translateX(-50%);
  font-size:12px;color:rgba(255,255,255,.65);
  white-space:nowrap;
  pointer-events:none;
}

/* ===== 入场动效 ===== */
.reveal{transition:opacity .4s cubic-bezier(.22,.61,.36,1),transform .4s cubic-bezier(.22,.61,.36,1)}
.js .reveal{opacity:0;transform:translateY(14px)}
.js .reveal.in{opacity:1;transform:none}

/* ===== 平板 / 桌面 ===== */
@media (min-width:600px){
  .hl-grid{grid-template-columns:repeat(4,1fr)}
  .skill-grid{grid-template-columns:repeat(2,1fr)}
  .proj-grid{grid-template-columns:repeat(2,1fr)}
  .award-list{grid-template-columns:repeat(2,1fr)}
}
@media (min-width:768px){
  :root{--pad:24px}
  body{font-size:15.5px;padding-bottom:0}
  .dock{display:none}
  .to-top{right:22px;bottom:22px}
  .toast{bottom:34px}
  .sec{padding:44px 0}
  .sec-title{font-size:20.5px}
  .hero{padding:30px 0 8px}
  .hero-card{padding:32px}
  .avatar{width:76px;height:76px;border-radius:20px;font-size:30px}
  .hero-name{font-size:36px}
  .hero-role{font-size:14px}
  .hero-sum{font-size:14.6px}
  .hero-cta .btn{flex:0 0 auto}
  .hl-value{font-size:23px}
  .hl-card{padding:20px 18px}
  .proj-card{padding:22px}
  .skill-card{padding:20px}
  .edu-card{padding:26px}
  .about-card{padding:26px}
  .nav .btn-ghost{
    display:inline-flex;min-height:40px;padding:0 14px;background:transparent;
    border-color:transparent;color:var(--text2);
  }
  .nav .btn-ghost:hover{background:var(--surface2);color:var(--text)}
}
@media (min-width:980px){
  .skill-grid{grid-template-columns:repeat(3,1fr)}
}

/* ===== 减少动效 ===== */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
  .js .reveal{opacity:1!important;transform:none!important}
  .award-img{opacity:1!important}
}

/* ===== 打印 / 导出 PDF ===== */
@media print{
  html[data-theme="dark"]{
    --bg:#fff;--surface:#fff;--surface2:#f7f8fb;--text:#111;--text2:#333;
    --muted:#666;--line:#dcdcdc;--pri:#2f4bd6;--pri2:#5a3fd6;--teal:#0b7a70;
    --sh:none;--sh2:none;--navbg:#fff;
  }
  @page{margin:14mm 12mm}
  body{background:#fff!important;color:#111;font-size:11.5pt;line-height:1.6;padding-bottom:0!important}
  body::before{display:none!important}
  .nav,.dock,.to-top,.toast,.hero-cta,.tablist,.lightbox,.no-print,.zoom-tip{display:none!important}
  .sec{padding:10px 0!important;break-inside:auto}

  function h(tag, attrs) {
    var node = document.createElement(tag);
    var kids = Array.prototype.slice.call(arguments, 2);

      for (var k in attrs) {
        if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
        var v = attrs[k];
        if (v === null || v === undefined || v === false || v === '') continue;
        if (k === 'class') node.className = v;
        else if (k === 'text') node.textContent = v;
        else if (k === 'html') node.innerHTML = v;
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
        else if (v === true) node.setAttribute(k, '');
        else node.setAttribute(k, v);
      }
    }
    append(node, kids);
    return node;
  }

    for (var i = 0; i < kids.length; i++) {

      parent.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));

    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !lightbox.hidden) closeLightbox();
    });

    return lightbox;
  }

  function openLightbox(src, alt) {
    var lb = ensureLightbox();
    lastFocus = document.activeElement;
    var img = lb.querySelector('.lightbox-img');
    img.src = src;
    img.alt = alt || '';
    lb.hidden = false;
    void lb.offsetWidth;
    lb.classList.add('show');
    document.body.style.overflow = 'hidden';
    lb.querySelector('.lightbox-close').focus();
  }

  function closeLightbox() {
    if (!lightbox || lightbox.hidden) return;
    var lb = lightbox;
    lb.classList.remove('show');
    document.body.style.overflow = '';
    setTimeout(function () {
      lb.hidden = true;

  /* ---------- 项目 ---------- */
  function renderProjects() {
    var el = buildTabs(resume.projects, function (t) {
      return h('div', { class: 'proj-grid' }, t.items.map(function (p) {
        return h('article', { class: 'card proj-card' },
          h('div', { class: 'proj-head' },
            h('div', {},
              h('h3', { class: 'proj-name', text: p.name }),
              p.role ? h('div', { class: 'proj-role', text: p.role }) : null
            ),
            p.meta ? h('span', { class: 'proj-meta', text: p.meta }) : null
          ),
          (p.stack && p.stack.length) ? h('ul', { class: 'proj-stack' }, p.stack.map(function (s) {
            return h('li', { class: 'stack-chip', text: s });
          })) : null,
          h('ul', { class: 'proj-points' }, p.points.map(function (pt) { return h('li', { text: pt }); })),
          p.link ? h('a', { class: 'proj-link', href: p.link, target: '_blank', rel: 'noopener noreferrer' },
            h('span', { text: '查看项目' }), icon('link', 14)) : null
        );
      }));
    }, '项目分类');
    return section('projects', '项目经历', el);
  }

  /* ---------- 技能矩阵 ---------- */
  function renderSkills() {
    var grid = h('div', { class: 'skill-grid' }, resume.skills.map(function (g) {
      return h('div', { class: 'card skill-card' },
        h('h3', { class: 'skill-title' }, h('span', { class: 'dot' }), h('span', { text: g.title })),
        h('ul', { class: 'chips' }, g.items.map(function (i) { return h('li', { class: 'chip', text: i }); }))
      );
    }));
    return section('skills', '技能矩阵', grid);
  }

  /* ---------- 教育背景 ---------- */
  function renderEducation() {
    var e = resume.education;
    var card = h('div', { class: 'card edu-card' },
      h('div', { class: 'edu-top' },
        h('h3', { class: 'edu-school', text: e.school }),
        h('ul', { class: 'pills' }, e.badges.map(function (b) { return h('li', { class: 'pill', text: b }); }))
      ),
      h('p', { class: 'edu-meta', text: e.degree + ' ｜ ' + e.period + (e.location ? ' ｜ ' + e.location : '') }),
      e.courses && e.courses.length ? h('div', { class: 'sub-head', text: '核心课程' }) : null,
      e.courses && e.courses.length ? h('ul', { class: 'chips' }, e.courses.map(function (c) {
        return h('li', { class: 'chip', text: c });
      })) : null,
      e.language ? h('div', { class: 'sub-head', text: '语言能力' }) : null,
      e.language ? h('p', { class: 'edu-meta', text: e.language }) : null
    );
    return section('education', '教育背景', card);
  }

  /* ---------- 证书图片：懒加载 + 淡入 + 点击放大 + 失败提示 ---------- */
  function certFigure(src, alt) {
    var fig = h('div', { class: 'award-figure' });

    var img = h('img', {
      class: 'award-img',
      src: src,
      alt: alt,
      loading: 'lazy',
      decoding: 'async',
      tabindex: '0',
      role: 'button',
      'aria-label': alt + '，点击查看大图'
    });

    if (img.complete && img.naturalWidth > 0) {
      img.classList.add('loaded');
    } else {
      img.addEventListener('load', function () { img.classList.add('loaded'); });
    }

    img.addEventListener('error', function () {
      img.classList.add('img-error', 'loaded');
      if (!fig.parentNode) return;
      var tip = fig.nextElementSibling;
      if (tip && tip.classList.contains('img-tip')) return;
      var tipEl = h('p', {
        class: 'img-tip',
        text: '证书图片未能加载，请确认文件名与路径完全一致：' + src
      });
      fig.parentNode.insertBefore(tipEl, fig.nextSibling);
    });

    img.addEventListener('click', function () {
      if (img.classList.contains('img-error')) return;
      openLightbox(src, alt);
    });
    img.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (!img.classList.contains('img-error')) openLightbox(src, alt);
      }
    });

    fig.appendChild(img);
    fig.appendChild(h('span', { class: 'zoom-tip', 'aria-hidden': 'true' },
      icon('zoom', 12), h('span', { text: '点击放大' })));

    return fig;
  }

  /* ---------- 获奖与证书 ---------- */
  function awardItem(iconName, name, issuer, note, desc, image) {
    return h('article', { class: 'card award-item' },
      h('div', { class: 'award-icon' }, icon(iconName, 18)),
      h('div', { class: 'award-body' },
        h('h3', { class: 'award-name', text: name }),
        issuer ? h('div', { class: 'award-issuer', text: issuer }) : null,
        note ? h('div', { class: 'award-note', text: note }) : null,
        desc ? h('p', { class: 'award-desc', text: desc }) : null,
        image ? certFigure(image, name + ' 证书') : null
      )
    );
  }

  function renderAwards() {
    var blocks = [];
    var comp = resume.awards.competitions || [];
    if (comp.length) {
      blocks.push(h('div', { class: 'award-block' },
        h('div', { class: 'sub-head', text: '竞赛获奖' }),
        h('div', { class: 'award-list' }, comp.map(function (a) {
          return awardItem('award', a.name, '', a.note, '');
        }))
      ));
    }
    var certs = resume.awards.certificates || [];
    if (certs.length) {
      blocks.push(h('div', { class: 'award-block' },
        h('div', { class: 'sub-head', text: '证书与资质' }),
        h('div', { class: 'award-list' }, certs.map(function (c) {
          return awardItem('badge', c.name, c.issuer, '', c.desc, c.image);
        }))
      ));
    }
    if (!blocks.length) return null;
    return section('awards', '获奖与证书', h('div', {}, blocks));
  }

  /* ---------- 自我评价 ---------- */
  function renderAbout() {
    if (!resume.about) return null;
    return section('about', '自我评价',
      h('div', { class: 'card about-card' }, h('p', { class: 'about-text', text: resume.about })));
  }

  /* =========================================================
     五、Tabs 组件
     ========================================================= */
  function buildTabs(tabs, renderPanel, ariaLabel) {
    var wrap = h('div', {});
    var list = h('div', { class: 'tablist', role: 'tablist', 'aria-label': ariaLabel || '内容分类' });
    var panelsWrap = h('div', {});
    var buttons = [];
    var panels = [];

    tabs.forEach(function (t, i) {
      var btn = h('button', {
        type: 'button',
        class: i === 0 ? 'tab active' : 'tab',
        role: 'tab',
        id: 'tab-' + t.id,
        'aria-controls': 'panel-' + t.id,
        'aria-selected': i === 0 ? 'true' : 'false',
        tabindex: i === 0 ? '0' : '-1'
      }, t.label);

      var panel = h('div', {
        class: 'tabpanel',
        role: 'tabpanel',
        id: 'panel-' + t.id,
        'aria-labelledby': 'tab-' + t.id,
        tabindex: '0'
      }, renderPanel(t));

      if (i !== 0) panel.hidden = true;
      buttons.push(btn);
      panels.push(panel);
      list.appendChild(btn);
      panelsWrap.appendChild(panel);
    });

    function activate(idx, focus) {
      if (idx < 0 || idx >= buttons.length) return;
      buttons.forEach(function (b, i) {
        var on = i === idx;
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
        b.tabIndex = on ? 0 : -1;
        panels[i].hidden = !on;
      });
      if (focus) buttons[idx].focus();
    }

    list.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('.tab') : null;
      if (!btn) return;
      activate(buttons.indexOf(btn), false);
    });

    list.addEventListener('keydown', function (e) {
      var cur = buttons.indexOf(document.activeElement);
      if (cur < 0) return;
      var next = -1;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next = (cur + 1) % buttons.length;
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = (cur - 1 + buttons.length) % buttons.length;
      else if (e.key === 'Home') next = 0;
      else if (e.key === 'End') next = buttons.length - 1;
      if (next >= 0) { e.preventDefault(); activate(next, true); }
    });

    wrap.appendChild(list);
    wrap.appendChild(panelsWrap);
    return wrap;
  }

  /* =========================================================
     六、渲染主流程
     ========================================================= */
  var frag = document.createDocumentFragment();
  frag.appendChild(renderHero());

  var builders = [
    ['highlights', '亮点', renderHighlights],
    ['experience', '经历', renderExperience],
    ['projects', '项目', renderProjects],
    ['skills', '技能', renderSkills],
    ['education', '教育', renderEducation],
    ['awards', '证书', renderAwards],
    ['about', '自评', renderAbout]
  ];

  builders.forEach(function (b) {
    var node = b[2]();
    if (!node) return;
    frag.appendChild(node);
    navItems.push({ id: b[0], label: b[1] });
  });

  app.appendChild(frag);

  /* ---------- 导航锚点 ---------- */
  var navLinks = $('#navLinks');
  navItems.forEach(function (it) {
    navLinks.appendChild(h('a', {
      class: 'nav-link',
      href: '#' + it.id,
      'data-target': it.id
    }, it.label));
  });

  /* ---------- 页脚 ---------- */
  var now = new Date();
  var ym = now.getFullYear() + '.' + ('0' + (now.getMonth() + 1)).slice(-2);
  $('#footer').innerHTML =
    '<p>© ' + now.getFullYear() + ' ' + resume.name + ' · 个人简历</p>' +
    '<p class="no-print">更新于 ' + ym + ' · 单文件零外部依赖，可离线打开</p>';

  /* ---------- 底部快捷栏 ---------- */
  var dock = $('#dock');
  var phone = getPhone();
  var email = getEmail();
  if (phone) dock.appendChild(h('a', { class: 'btn', href: 'tel:' + phone }, icon('phone', 16), h('span', { text: '打电话' })));
  if (email) dock.appendChild(h('a', { class: 'btn btn-primary', href: 'mailto:' + email }, icon('mail', 16), h('span', { text: '发邮件' })));
  if (email) dock.appendChild(h('button', { class: 'btn', type: 'button', onclick: copyEmail }, icon('copy', 16), h('span', { text: '复制邮箱' })));

  /* =========================================================
     七、交互：主题 / 打印 / 返回顶部 / 滚动高亮 / 入场动效
     ========================================================= */
  var root = document.documentElement;
  var themeBtn = $('#themeBtn');
  var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;

  function paintThemeBtn() {
    var dark = root.getAttribute('data-theme') === 'dark';
    themeBtn.innerHTML = '';
    themeBtn.appendChild(icon(dark ? 'sun' : 'moon', 18));
    themeBtn.setAttribute('aria-label', dark ? '切换到浅色模式' : '切换到深色模式');
  }

  function syncThemeColor() {
    var m = document.querySelector('meta[name="theme-color"]');
    if (!m) { m = h('meta', { name: 'theme-color' }); document.head.appendChild(m); }
    m.setAttribute('content', root.getAttribute('data-theme') === 'dark' ? '#0a0d16' : '#f4f6fb');
  }

  function setTheme(t, persist) {
    root.setAttribute('data-theme', t);
    if (persist) { try { localStorage.setItem('theme', t); } catch (e) {} }
    paintThemeBtn();
    syncThemeColor();
  }

  paintThemeBtn();
  syncThemeColor();

  themeBtn.addEventListener('click', function () {
    setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true);
  });

  if (mq && mq.addEventListener) {
    mq.addEventListener('change', function (e) {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (err) {}
      if (!saved) setTheme(e.matches ? 'dark' : 'light', false);
    });
  }

  $('#printBtn').addEventListener('click', function () { window.print(); });

  var toTop = $('#toTop');
  toTop.appendChild(icon('up', 20));
  toTop.addEventListener('click', function () {
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
  });

  var ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      var y = window.pageYOffset || document.documentElement.scrollTop;
      toTop.classList.toggle('show', y > 420);

      var current = '';
      for (var i = 0; i < navItems.length; i++) {
        var el = document.getElementById(navItems[i].id);
        if (el && el.getBoundingClientRect().top <= 90) current = navItems[i].id;
      }
      var links = navLinks.children;
      for (var j = 0; j < links.length; j++) {
        links[j].classList.toggle('active', links[j].getAttribute('data-target') === current);
      }
      ticking = false;
    });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  (function reveal() {
    var els = document.querySelectorAll('.reveal');
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || !('IntersectionObserver' in window)) {
      for (var i = 0; i < els.length; i++) els[i].classList.add('in');
      return;
    }
    var io = new IntersectionObserver(function (entries, obs) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          en.target.classList.add('in');
          obs.unobserve(en.target);
        }
      });
    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.04 });
    for (var j = 0; j < els.length; j++) io.observe(els[j]);
  })();

})();
</script>
</body>
